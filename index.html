<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" sizes="192x192" />
  <link rel="icon" href="./icon-512.png" sizes="512x512" />
  <title>Interval Timer</title>
  <style>
    :root{
      --bg:#0b1020; --card:#131a2a; --text:#f8fafc; --muted:#94a3b8;
      --work:#22c55e; --rest:#38bdf8; --border:rgba(255,255,255,.10);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg)}
    body{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:radial-gradient(circle at top,rgba(56,189,248,.12),transparent 34%),var(--bg);
      -webkit-tap-highlight-color:transparent;
      overscroll-behavior:none;
    }
    .app{
      min-height:100vh;
      max-width:560px;
      margin:0 auto;
      padding:22px 18px 28px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:18px;
    }
    .top{
      display:flex;justify-content:space-between;align-items:center;
      color:var(--muted);font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    }
    .card{
      background:rgba(19,26,42,.94);
      border:1px solid var(--border);
      border-radius:28px;
      padding:30px 22px;
      text-align:center;
    }
    .phase{font-size:18px;font-weight:900;letter-spacing:.12em;margin-bottom:8px}
    .phase.work{color:var(--work)} .phase.rest{color:var(--rest)} .phase.done{color:#fbbf24}
    .timer{
      font-size:clamp(88px,26vw,150px);
      line-height:.95;font-weight:900;font-variant-numeric:tabular-nums;
      letter-spacing:-.06em;margin:12px 0 18px;
    }
    .progress{height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
    .bar{height:100%;width:100%;background:var(--work);transition:width .18s linear}
    .sub{margin-top:14px;color:var(--muted);font-size:15px;min-height:22px}
    .controls{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
    button{
      appearance:none;border:none;border-radius:18px;padding:16px 12px;min-height:54px;
      font-size:16px;font-weight:850;cursor:pointer;color:var(--text);background:#1f2937;
      border:1px solid var(--border);touch-action:manipulation;
    }
    button:active{transform:scale(.98)}
    .primary{background:#f8fafc;color:#0f172a}
    .settings{
      background:rgba(19,26,42,.72);border:1px solid var(--border);
      border-radius:22px;padding:16px;
    }
    .settings summary{cursor:pointer;color:var(--muted);font-weight:850;user-select:none}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
    label{display:flex;flex-direction:column;gap:7px;color:var(--muted);font-size:12px;font-weight:750}
    input{
      width:100%;border-radius:14px;border:1px solid var(--border);background:#0f172a;
      color:var(--text);font-size:18px;font-weight:800;padding:12px;text-align:center;
    }
    .toggles{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
    .toggle{
      flex:1 1 130px;display:flex;align-items:center;justify-content:center;gap:8px;
      min-height:46px;border-radius:14px;background:#0f172a;border:1px solid var(--border);
      color:var(--muted);font-size:14px;font-weight:800;
    }
    .toggle input{width:auto}
    .hint{font-size:12px;color:var(--muted);line-height:1.45;text-align:center}
    @media (max-width:380px){
      .grid{grid-template-columns:1fr}
      .controls{grid-template-columns:1fr 1fr}
      .primary{grid-column:1/-1}
    }
  </style>
</head>
<body>
<main class="app">
  <div class="top">
    <span id="roundLabel">Tur 1 / 23</span>
    <span id="statusLabel">Hazır</span>
  </div>

  <section class="card">
    <div id="phase" class="phase work">WORK</div>
    <div id="timer" class="timer">36</div>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div id="sub" class="sub">Başlamak için Start'a dokun.</div>
  </section>

  <section class="controls">
    <button id="startBtn" class="primary">▶ Start</button>
    <button id="resetBtn">↻ Reset</button>
    <button id="skipBtn">⏭ Geç</button>
  </section>

  <details class="settings">
    <summary>Ayarlar</summary>
    <div class="grid">
      <label>Tur<input id="roundsInput" type="number" min="1" max="999" value="23"></label>
      <label>Çalışma (sn)<input id="workInput" type="number" min="1" max="3600" value="36"></label>
      <label>Mola (sn)<input id="restInput" type="number" min="1" max="3600" value="5"></label>
    </div>
    <div class="toggles">
      <label class="toggle"><input id="soundToggle" type="checkbox" checked> Ses</label>
      <label class="toggle"><input id="vibrateToggle" type="checkbox" checked> Titreşim</label>
    </div>
  </details>

  <div class="hint">
    Chrome'da “Install app” ile kurunca ana ekranda ikonla, bağımsız uygulama gibi açılır.
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const timerEl=$("timer"), phaseEl=$("phase"), barEl=$("bar"), roundLabel=$("roundLabel");
  const statusLabel=$("statusLabel"), subEl=$("sub"), startBtn=$("startBtn");
  const resetBtn=$("resetBtn"), skipBtn=$("skipBtn"), roundsInput=$("roundsInput");
  const workInput=$("workInput"), restInput=$("restInput"), soundToggle=$("soundToggle");
  const vibrateToggle=$("vibrateToggle");

  let totalRounds=23, workSeconds=36, restSeconds=5;
  let currentRound=1, phase="work", remaining=36, running=false, intervalId=null;
  let endAt=null, audioCtx=null, lastDisplayedSecond=36;

  function readSettings(){
    totalRounds=Math.max(1,parseInt(roundsInput.value||"23",10));
    workSeconds=Math.max(1,parseInt(workInput.value||"36",10));
    restSeconds=Math.max(1,parseInt(restInput.value||"5",10));
  }
  function phaseDuration(){return phase==="work"?workSeconds:restSeconds}
  function ensureAudio(){
    if(!audioCtx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC) audioCtx=new AC();
    }
    if(audioCtx&&audioCtx.state==="suspended") audioCtx.resume();
  }
  function beep(freq=880,duration=.08,volume=.16,type="sine"){
    if(!soundToggle.checked)return;
    ensureAudio(); if(!audioCtx)return;
    const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.type=type; osc.frequency.value=freq;
    gain.gain.setValueAtTime(volume,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime+duration);
  }
  function vib(pattern){if(vibrateToggle.checked&&navigator.vibrate)navigator.vibrate(pattern)}
  function startSound(){beep(420,.18,.18,"triangle");setTimeout(()=>beep(520,.18,.16,"triangle"),90)}
  function warningSound(){beep(980,.065,.12);vib(20)}
  function phaseEndSound(){beep(740,.11,.18,"triangle");setTimeout(()=>beep(1040,.16,.18,"triangle"),100);vib([50,40,70])}
  function restTickSound(){beep(620,.055,.10);vib(15)}
  function doneSound(){[660,880,1100].forEach((f,i)=>setTimeout(()=>beep(f,.18,.18,"triangle"),i*130));vib([80,60,80,60,140])}

  function render(){
    timerEl.textContent=Math.max(0,remaining);
    roundLabel.textContent=`Tur ${Math.min(currentRound,totalRounds)} / ${totalRounds}`;
    if(phase==="work"){
      phaseEl.textContent="WORK"; phaseEl.className="phase work"; barEl.style.background="var(--work)";
      subEl.textContent=remaining<=6&&running?"Son saniyeler!":"Çalışma";
    } else if(phase==="rest"){
      phaseEl.textContent="REST"; phaseEl.className="phase rest"; barEl.style.background="var(--rest)";
      subEl.textContent="Mola";
    } else {
      phaseEl.textContent="BİTTİ 🎉"; phaseEl.className="phase done"; timerEl.textContent="✓";
      barEl.style.width="100%"; subEl.textContent=`${totalRounds} tur tamamlandı.`;
      roundLabel.textContent=`Tur ${totalRounds} / ${totalRounds}`; statusLabel.textContent="Tamamlandı"; return;
    }
    barEl.style.width=`${Math.max(0,Math.min(100,(remaining/phaseDuration())*100))}%`;
    statusLabel.textContent=running?"Çalışıyor":"Duraklatıldı";
  }

  function setPhase(next,seconds){
    phase=next; remaining=seconds; lastDisplayedSecond=seconds;
    endAt=performance.now()+seconds*1000; render();
  }
  function transition(){
    if(phase==="work"){phaseEndSound();setPhase("rest",restSeconds)}
    else{
      if(currentRound>=totalRounds)finish();
      else{currentRound++;startSound();setPhase("work",workSeconds)}
    }
  }
  function processSecondSounds(prev,now){
    for(let s=prev-1;s>=now;s--){
      if(phase==="work"&&s<=6&&s>=1)warningSound();
      if(phase==="rest"&&s<restSeconds&&s>=1)restTickSound();
    }
  }
  function tick(){
    if(!running||phase==="done")return;
    const ms=endAt-performance.now();
    const nr=Math.max(0,Math.ceil(ms/1000));
    if(nr!==remaining){
      processSecondSounds(lastDisplayedSecond,nr);
      remaining=nr; lastDisplayedSecond=nr; render();
    }
    if(ms<=0)transition();
  }
  function start(){
    ensureAudio(); readSettings();
    if(phase==="done"){currentRound=1;phase="work";remaining=workSeconds;lastDisplayedSecond=remaining}
    if(!running){
      endAt=performance.now()+remaining*1000;
      if(phase==="work"&&remaining===workSeconds)startSound();
      running=true; startBtn.textContent="⏸ Pause";
      intervalId=setInterval(tick,100); render();
    }else pause();
  }
  function pause(){
    if(!running)return;
    remaining=Math.max(0,Math.ceil(Math.max(0,endAt-performance.now())/1000));
    lastDisplayedSecond=remaining; running=false; clearInterval(intervalId); intervalId=null;
    startBtn.textContent="▶ Devam"; render();
  }
  function reset(){
    clearInterval(intervalId);intervalId=null;running=false;readSettings();
    currentRound=1;phase="work";remaining=workSeconds;lastDisplayedSecond=remaining;endAt=null;
    startBtn.textContent="▶ Start";statusLabel.textContent="Hazır";subEl.textContent="Başlamak için Start'a dokun.";render();
  }
  function skip(){
    if(phase==="done")return;
    if(!running){
      readSettings();
      if(phase==="work"){phase="rest";remaining=restSeconds}
      else if(currentRound<totalRounds){currentRound++;phase="work";remaining=workSeconds}
      else{finish();return}
      lastDisplayedSecond=remaining;endAt=null;render();return;
    }
    transition();
  }
  function finish(){
    clearInterval(intervalId);intervalId=null;running=false;phase="done";endAt=null;
    startBtn.textContent="↻ Yeniden";doneSound();render();
  }

  startBtn.addEventListener("click",start);
  resetBtn.addEventListener("click",reset);
  skipBtn.addEventListener("click",skip);
  [roundsInput,workInput,restInput].forEach(i=>i.addEventListener("change",()=>{if(!running)reset()}));
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&running)tick()});

  if("serviceWorker" in navigator){
    window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
  }
  reset();
})();
</script>
</body>
</html>
